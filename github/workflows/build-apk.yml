name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Create debug keystore
        run: |
          mkdir -p /tmp/smouha-keys
          keytool -genkeypair -keystore /tmp/smouha-keys/debug.keystore \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Smouha,O=Smouha,C=EG"

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Setup Gradle 8.5
        run: |
          curl -fsSL -o /tmp/gradle-8.5-bin.zip https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q /tmp/gradle-8.5-bin.zip -d /tmp

      - name: Assemble release
        run: /tmp/gradle-8.5/bin/gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmouhaCall-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
